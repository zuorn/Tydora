[package]
name = "tydora-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tydora CLI — command-line interface for Tydora vaults"
readme = "README.md"

[[bin]]
name = "tydora-cli"
path = "src/main.rs"

[lints.rust]
# main.rs 里有 windows-sys FFI（SetConsoleCP / SetConsoleOutputCP），FFI 本质
# 上需要 unsafe。改为 warn 让 CI 仍能在 review 时看到，但本 crate 内允许。
unsafe_code = "warn"

[dependencies]
# CLI 解析（builder 风格，参考 Flowix flowix-cli/src/cli.rs）
clap = { workspace = true }
clap_complete = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# 序列化（--json 输出 + frontmatter 解析）
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# 日志
env_logger = { workspace = true }

# 受限 CLI 语法（MCP 阶段会用到，Phase 1 仅占位）
shell-words = { workspace = true }

# 业务逻辑复用层（vault 扫描 / frontmatter / note id 解析），
# 与 tydora-desktop 同 workspace 统一管控。
# 详见 `app/tydora-core/README.md`。
tydora-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
# console codepage 切换（CP_UTF8 = 65001）
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
