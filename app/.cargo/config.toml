# ----------------------------------------------------------------------------
# 统一 build artifact 目录：整个 Tydora Cargo workspace（app/）的产物都落到
# `<repo-root>/target/`（app/ 的相对上一级）。.gitignore 里 target/ 已忽略。
# ----------------------------------------------------------------------------
[build]
target-dir = "../target"

# ----------------------------------------------------------------------------
# Windows MSVC linker：统一用 rust-lld
#
# 背景：这台机器装了 Visual Studio BuildTools，但 MSVC bin 不在默认 PATH；
# 而 Git Bash 的 PATH 里第一个 `link` 是 coreutils 的 link（建硬链接用），
# 会让 cargo 误调到它并报 `extra operand`。旧解法是在这里硬编码 MSVC
# link.exe 路径 + cli-env.sh 导出 LIB/INCLUDE，机器相关且脆弱。
#
# rust-lld 是 rustup 工具链自带的 LLVM lld 前端，rustc 能从 sysroot 找到它，
# 无需依赖 MSVC bin 目录，也与迁移前 src-tauri/.cargo 的行为一致。
# ----------------------------------------------------------------------------
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
